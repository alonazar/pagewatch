name: build

# Every push and pull request is tested. Pushing a tag like v1.0.0 also
# builds the Windows and Mac downloads and publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  actions: read # lets SignPath fetch the unsigned file from this run

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # A Mac runner, so we can combine the Intel and Apple Silicon builds into one file.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist mac
          LDFLAGS="-s -w -X main.version=$VERSION"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/pagewatch-windows.exe .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o mac/pagewatch-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o mac/pagewatch-amd64 .
          lipo -create -output mac/pagewatch mac/pagewatch-arm64 mac/pagewatch-amd64
          codesign --force --sign - mac/pagewatch
          chmod +x mac/pagewatch
          (cd mac && zip ../dist/pagewatch-mac.zip pagewatch)

      # Code signing through SignPath Foundation (see "Code signing policy" in the README).
      # It runs only once the repository variable SIGNPATH_ORGANIZATION_ID is set; until
      # then, releases are published unsigned as before. Each request waits for a manual
      # approval in SignPath, for up to two hours.
      # Needs: repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
      # SIGNPATH_SIGNING_POLICY_SLUG, and the secret SIGNPATH_API_TOKEN. The SignPath
      # project's artifact configuration is in .signpath/artifact-configuration.xml.
      - name: Upload the unsigned Windows file for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: pagewatch-windows-unsigned
          path: dist/pagewatch-windows.exe
          retention-days: 1
      - name: Sign the Windows file
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Use the signed Windows file
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          test -s signed/pagewatch-windows.exe
          if cmp -s signed/pagewatch-windows.exe dist/pagewatch-windows.exe; then
            echo "The file came back unchanged, so it was not signed." >&2
            exit 1
          fi
          mv -f signed/pagewatch-windows.exe dist/pagewatch-windows.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "pagewatch ${{ github.ref_name }}" \
            --notes "Download **pagewatch-windows.exe** (Windows) or **pagewatch-mac.zip** (Mac), then follow the steps in the [README](https://github.com/${{ github.repository }}#readme)."
